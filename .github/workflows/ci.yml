name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: build + test (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Backend tests
        run: npm test --workspace backend

      - name: Frontend tests
        run: npx vitest run
        working-directory: frontend

      - name: Frontend build
        run: npx vite build
        working-directory: frontend
